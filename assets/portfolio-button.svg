<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 88" width="520" height="88" role="img" aria-label="View my portfolio at benoy-joseph.vercel.app">
  <style>
    .label { font: 650 23px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #f1ede4; letter-spacing: -.2px; }
    .url   { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #8f93b5; }
    .arrow { animation: nudge 2.4s cubic-bezier(.4, 0, .2, 1) infinite; }
    @keyframes nudge {
      0%, 55%, 100% { transform: translateX(0); }
      70%           { transform: translateX(6px); }
    }
    .sheen { animation: sheen 6s ease-in-out infinite; }
    @keyframes sheen {
      0%, 60%  { transform: translateX(-160px); opacity: 0; }
      65%      { opacity: .5; }
      85%      { transform: translateX(560px); opacity: .5; }
      86%, 100% { transform: translateX(560px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow, .sheen { animation: none; }
      .sheen { opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7aa8ff"/>
      <stop offset=".55" stop-color="#c79bf2"/>
      <stop offset="1"   stop-color="#f2b66d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="2" y="2" width="516" height="84" rx="16"/></clipPath>
  </defs>

  <!-- Card with gradient border -->
  <rect x="1" y="1" width="518" height="86" rx="17" fill="url(#edge)"/>
  <rect x="2.5" y="2.5" width="515" height="83" rx="15.5" fill="#161b33"/>

  <g clip-path="url(#clip)">
    <rect class="sheen" x="0" y="0" width="120" height="88" fill="url(#glow)" transform="skewX(-20)"/>
  </g>

  <!-- Browser-window glyph -->
  <g transform="translate(26 22)">
    <rect width="44" height="44" rx="11" fill="#20264a"/>
    <rect x="10" y="12" width="24" height="20" rx="3.5" fill="none" stroke="#f2b66d" stroke-width="2"/>
    <line x1="10" y1="18" x2="34" y2="18" stroke="#f2b66d" stroke-width="2"/>
    <circle cx="14" cy="15" r="1.1" fill="#f2b66d"/>
    <circle cx="17.5" cy="15" r="1.1" fill="#f2b66d"/>
  </g>

  <text class="label" x="88" y="42">View my portfolio</text>
  <text class="url"   x="89" y="64">benoy-joseph.vercel.app</text>

  <!-- Arrow -->
  <g class="arrow">
    <circle cx="474" cy="44" r="20" fill="#f2b66d"/>
    <path d="M465 44h16M475 37.5l6.5 6.5-6.5 6.5" fill="none" stroke="#161b33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
