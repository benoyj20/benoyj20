<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Benoy Joseph. I build systems where data, software engineering, and AI meet." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .card  { fill: #161b33; }
    .grid  { fill: #2a3156; }
    .name  { font: 700 64px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #f1ede4; letter-spacing: -1px; }
    .lead  { font: 400 23px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #c9c6d8; }
    .meta  { font: 400 18px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #8f93b5; }
    .span  { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #a9acc9; }
    .ms    { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #6f7499; }
    .title { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #f1ede4; }
    .track { fill: #20264a; }

    /* One orchestrated loop: spans fill in left to right, hold, then reset. */
    .bar {
      transform-box: fill-box;
      transform-origin: left center;
      animation: grow 7s cubic-bezier(.4, 0, .2, 1) infinite both;
    }
    .d1 { animation-delay: .2s; }
    .d2 { animation-delay: .9s; }
    .d3 { animation-delay: 1.7s; }
    .d4 { animation-delay: 2.3s; }
    .d5 { animation-delay: 3.1s; }
    @keyframes grow {
      0%        { transform: scaleX(0); opacity: 1; }
      12%       { transform: scaleX(1); opacity: 1; }
      82%       { transform: scaleX(1); opacity: 1; }
      92%, 100% { transform: scaleX(1); opacity: 0; }
    }

    .scan { animation: scan 7s linear infinite; }
    @keyframes scan {
      0%   { transform: translateX(0);     opacity: .9; }
      58%  { transform: translateX(330px); opacity: .9; }
      62%, 100% { transform: translateX(330px); opacity: 0; }
    }

    .ok { animation: ok 7s ease-out infinite both; }
    @keyframes ok {
      0%, 55%   { opacity: 0; }
      62%, 85%  { opacity: 1; }
      93%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar, .scan, .ok { animation: none; }
      .scan { opacity: 0; }
    }
  </style>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" class="grid"/>
    </pattern>
    <clipPath id="cardclip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#cardclip)">
    <rect class="card" width="1200" height="320"/>
    <rect x="600" width="600" height="320" fill="url(#dots)" opacity=".55"/>
  </g>

  <!-- Left: who -->
  <text class="name" x="64" y="146">Benoy Joseph</text>
  <text class="lead" x="66" y="196">I build systems where data, software</text>
  <text class="lead" x="66" y="227">engineering, and AI meet.</text>
  <text class="meta" x="66" y="276">CS grad student at Northeastern</text>

  <!-- Right: a trace of one run -->
  <text class="title" x="660" y="72">trace: benoy_joseph.build()</text>
  <text class="ok ms" x="1130" y="72" text-anchor="end" fill="#8fd6b4" style="fill:#8fd6b4">done in 1.84s</text>

  <g>
    <text class="span" x="660" y="111">retrieve</text>
    <rect class="track" x="800" y="98" width="330" height="18" rx="4"/>
    <rect class="bar d1" x="800" y="98" width="62"  height="18" rx="4" fill="#7aa8ff"/>

    <text class="span" x="660" y="149">llm.generate</text>
    <rect class="track" x="800" y="136" width="330" height="18" rx="4"/>
    <rect class="bar d2" x="862" y="136" width="128" height="18" rx="4" fill="#f2b66d"/>

    <text class="span" x="660" y="187">tool.exec</text>
    <rect class="track" x="800" y="174" width="330" height="18" rx="4"/>
    <rect class="bar d3" x="960" y="174" width="64"  height="18" rx="4" fill="#c79bf2"/>

    <text class="span" x="660" y="225">eval.grounded</text>
    <rect class="track" x="800" y="212" width="330" height="18" rx="4"/>
    <rect class="bar d4" x="1024" y="212" width="58" height="18" rx="4" fill="#8fd6b4"/>

    <text class="span" x="660" y="263">ship</text>
    <rect class="track" x="800" y="250" width="330" height="18" rx="4"/>
    <rect class="bar d5" x="1082" y="250" width="48" height="18" rx="4" fill="#ef8f8f"/>
  </g>

  <!-- time axis -->
  <text class="ms" x="800"  y="294">0ms</text>
  <text class="ms" x="1130" y="294" text-anchor="end">1840ms</text>

  <!-- playhead -->
  <rect class="scan" x="800" y="90" width="2" height="186" fill="#f1ede4" opacity=".9"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
